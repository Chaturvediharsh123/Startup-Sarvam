# Tool configuration only. This project is not packaged.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess without shell: we always pass fixed argument lists
    "S606",  # os.startfile is the documented way to open files on Windows
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
