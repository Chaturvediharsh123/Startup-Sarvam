# Golden set: utterance -> expected tool call (PDF "Testing": 150+ utterances,
# accuracy per language and latency; gate >= 85% by week 4, >= 90% at done).
#
# Fields
#   id           unique id, prefix = language label
#   lang         hi (Devanagari) | hinglish (Roman Hindi) | en | ta | te | bn | kn | mr
#   text         what the user says (the turn being scored)
#   history      optional earlier user turns, run first (memory follow-ups)
#   expect_tool  tool name, or null for plain Q&A / small talk (no tool call)
#   expect_args  SUBSET of arguments that must match. Numbers compare as numbers;
#                free-text keys (query, text, title, content) pass when every
#                expected word appears in the actual value (case-insensitive);
#                other keys compare case-insensitively. {} = any arguments.
#   tags         free labels for filtering (tools/golden_eval.py --tag)
#
# Validated by tests/golden/test_golden_set.py (no LLM calls). Scored by
# tools/golden_eval.py against a real or fake brain.

